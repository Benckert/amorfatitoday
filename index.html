/* ─────────────────────────────  tokens  ───────────────────────────── */
:root{
  --ink:#000;
  --cream:#f6e3bd;                 /* the title, and everything that leads */
  --paper:rgba(246,227,189,.86);
  --gold:#d9a441;                  /* 39°, the candle in the photographs */
  --mist:rgba(246,227,189,.58);

  /* A didone against the photographs: Bodoni Moda's thick-to-thin is
     the same drama the pictures have, and in tracked capitals over
     black it reads as the poster this evening deserves rather than as
     a website header. Inter carries every small line — it has no
     opinion, which at 0.6rem is the whole job. */
  --display:"Bodoni Moda","Didot","Bodoni MT","Times New Roman",serif;
  --micro:"Inter",-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;

  --gutter:clamp(1.25rem,5vw,5rem);
  /* The widest the words are ever allowed. Below it the gutter decides
     the inset; above it the frame does, and every section's first
     letter lands on the same vertical line however wide the screen. */
  --measure:1120px;
  --ease:cubic-bezier(.22,.61,.36,1);
  /* the room the section links keep at the foot of every screen */
  --rail:clamp(3.2rem,7svh,4.6rem);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}

html{
  background:var(--ink);
  scroll-behavior:smooth;
  scroll-snap-type:y mandatory;   /* every section is exactly one screen,
                                     so nothing can be snapped past */
  -webkit-text-size-adjust:100%;
}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:var(--micro);
  font-weight:300;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

::selection{background:rgba(217,164,65,.35);color:var(--cream)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1px solid var(--gold);outline-offset:5px;border-radius:2px}
img{display:block;max-width:100%}

/* ─────────────────────────────  sections  ───────────────────────────
   Each one is exactly one screen and never more, so the page is four
   screens and the snap is honest. Anything that would not fit is
   sized in svh so it shrinks with the screen instead of spilling. */
.panel{
  /* the frame's own edge, which is the gutter on a narrow screen and
     half the slack beside the measure on a wide one */
  --inset:max(var(--gutter),calc((100% - var(--measure)) / 2));
  position:relative;
  height:100svh;
  overflow:hidden;
  scroll-snap-align:start;
  display:grid;
}

/* ─── the photograph, whole and full-screen ───
   max-height and max-width together, with width and height left auto:
   the picture takes the largest size that fits the screen at its own
   aspect ratio. On a desktop a 2:3 photograph is limited by height and
   so stands the full height of the screen with the page's black either
   side — which is the shape the live site has. On a phone the screen is
   narrower than the photograph is tall, so the same rule limits it by
   width instead and it is letterboxed rather than cropped. Either way
   no pixel of any file is ever cut off, and object-fit — which would
   crop — appears nowhere in this stylesheet. */
.shot{
  position:absolute;inset:0;z-index:0;
  display:flex;align-items:center;justify-content:center;
}
.shot img{
  width:auto;height:auto;
  max-width:100%;max-height:100%;
  transform:var(--flip,none);
  background:linear-gradient(160deg,#141419,#000);  /* a shape, not a
                                broken-image icon, if a path is wrong */
  color:transparent;
}
/* Mirroring is the one edit the layout makes to a photograph, and it is
   made for the words rather than to the picture: it turns each figure's
   reach towards them. Delete a line to undo it. */
#amor .shot img{--flip:scaleX(-1)}

/* the dark that buys the words their legibility, without lightening the
   photograph: it is heavy only where text sits and clears quickly */
.veil{position:absolute;inset:0;z-index:1;pointer-events:none}
.veil-foot{
  background:linear-gradient(to top,
    rgba(0,0,0,.94) 0%,rgba(0,0,0,.86) 18%,rgba(0,0,0,.60) 38%,
    rgba(0,0,0,.22) 58%,rgba(0,0,0,0) 78%);
}
/* This was doing far too much. At .92 falling to .30 across most of the
   frame it was not buying legibility off the photograph, it was
   painting over it — the candlelight is the point of that picture. It
   is now a third of what it was, and the words are carried by their
   own shadow instead, which darkens only the pixels behind the letters
   rather than the whole left half of the room. */
.veil-left{
  background:
    linear-gradient(to right,rgba(0,0,0,.58) 0%,rgba(0,0,0,.30) 28%,
                    rgba(0,0,0,.08) 52%,rgba(0,0,0,0) 70%),
    linear-gradient(to top,rgba(0,0,0,.62) 0%,rgba(0,0,0,0) 24%);
}

.says{position:relative;z-index:2;min-width:0}

/* ────────────────────────  I. amor  (landing)  ─────────────────────── */
#amor{align-content:end;justify-items:center;text-align:center;
      padding:0 var(--inset) calc(var(--rail) + clamp(1rem,4svh,3rem))}

.title{
  font-family:var(--display);
  font-weight:500;
  font-size:clamp(2.1rem,8.2vw,5.4rem);
  line-height:1;
  letter-spacing:.16em;
  text-indent:.16em;              /* the tracking is added to the right of
                                     the last letter too; this re-centres it */
  text-transform:uppercase;
  color:var(--cream);
  margin:0;
  text-shadow:0 2px 30px rgba(0,0,0,.85);
}
.title .ch{display:inline-block;white-space:pre}
.title .word{display:inline-block;white-space:nowrap}

.subtitle{
  font-family:var(--micro);font-weight:300;
  font-size:clamp(.68rem,1.9vw,.92rem);
  letter-spacing:.28em;text-indent:.28em;
  color:var(--paper);
  margin:clamp(1rem,3svh,1.9rem) 0 0;
  text-shadow:0 1px 14px rgba(0,0,0,.9);
}
.when{
  font-family:var(--micro);font-weight:300;
  font-size:clamp(.66rem,1.7vw,.84rem);
  letter-spacing:.2em;text-indent:.2em;
  color:var(--gold);
  margin:clamp(.9rem,2.6svh,1.6rem) 0 0;
  text-shadow:0 1px 14px rgba(0,0,0,.9);
}

/* ─────────────────────────  II. about  (verse)  ───────────────────── */
/* The verse in the company's own hand beside the figure. Both whole:
   the verse is square and sized by height, the photograph is 2:3 and
   stands the full height of the screen at the outer edge. */
#about{
  grid-template-columns:1fr;
  align-items:center;
  padding:clamp(2rem,5svh,4rem) 44% var(--rail) var(--inset);
}
#about .verse{display:flex;align-items:center;justify-content:center}
#about .verse img{max-height:min(72svh,700px);max-width:100%;width:auto;height:auto}
/* Pinned to the panel rather than sized by a grid track: a grid item's
   height is decided by its content, so max-height:100% had nothing to
   resolve against and the figure was capped on width while its height
   ran free — 719x1079 rendered 575x1079, visibly squashed. Against the
   panel, which is exactly one screen, both limits resolve and the
   photograph keeps its own proportions at full height. */
#about .beside{
  position:absolute;top:0;right:0;bottom:0;width:42%;z-index:0;
  display:flex;align-items:center;justify-content:flex-end;
}
#about .beside img{
  max-height:100%;max-width:100%;width:auto;height:auto;
  transform:var(--flip,none);
}
#about .beside img{--flip:scaleX(-1)}
/* the inner edge dissolves rather than starting */
#about .beside::before{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(to right,#000 0%,rgba(0,0,0,.45) 6%,rgba(0,0,0,0) 14%);
}

/* ────────────────────────────  III. artists  ───────────────────────── */
#artists{align-content:center;padding:clamp(2rem,6svh,4rem) var(--inset) calc(var(--rail) + 1rem)}
.section-title{
  font-family:var(--display);font-weight:400;
  font-size:clamp(1.5rem,4.4vw,2.9rem);
  letter-spacing:.18em;text-indent:.18em;text-transform:uppercase;
  color:var(--cream);margin:0 0 clamp(1.6rem,5svh,3.2rem);
  text-shadow:0 1px 4px rgba(0,0,0,1),0 2px 24px rgba(0,0,0,.9);
}
.roster{list-style:none;margin:0;padding:0}
/* She leads the evening, so she is set apart from the list rather than
   made loud within it: the gold the page already uses for anything that
   leads, a little air beneath, and a short rule that stops before it
   becomes a divider. */
.roster li.lead{
  color:var(--gold);
  position:relative;
  padding-bottom:clamp(.9rem,2.8svh,1.4rem);
  margin-bottom:clamp(.6rem,2svh,1.1rem);
}
.roster li.lead::after{
  content:"";position:absolute;left:0;bottom:0;
  width:2.6rem;height:1px;
  background:linear-gradient(to right,rgba(217,164,65,.65),rgba(217,164,65,0));
}
.roster li{
  font-family:var(--micro);font-weight:300;
  font-size:clamp(.66rem,1.55vw,.88rem);
  letter-spacing:.18em;text-indent:.18em;text-transform:uppercase;
  color:var(--cream);
  line-height:1;
  padding:clamp(.42rem,1.5svh,.72rem) 0;
  text-shadow:0 1px 3px rgba(0,0,0,1),0 2px 14px rgba(0,0,0,.95);
}

/* ────────────────────────  IV. attend  (tickets)  ──────────────────── */


.reach{
  margin:clamp(1.2rem,4svh,2.2rem) 0 0;
  display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;
  font-family:var(--micro);font-size:.6rem;font-weight:300;
  letter-spacing:.22em;text-transform:uppercase;color:var(--mist);
}
.reach a{border-bottom:1px solid rgba(246,227,189,.22);padding-bottom:.15rem;transition:color .45s var(--ease),border-color .45s var(--ease)}
.reach a:hover{color:var(--cream);border-bottom-color:rgba(246,227,189,.6)}

/* ────────────────  the section links, on every screen  ───────────────
   The same row, in the same place, in all four sections — centred at
   the foot, underlined, divided by a rule, exactly as on the live
   site. It is written once as a <template> and stamped into each
   section by script, so the four copies cannot drift apart. */
.jump{
  position:absolute;left:0;right:0;bottom:0;z-index:4;
  display:flex;justify-content:center;align-items:center;flex-wrap:wrap;
  padding:0 var(--inset) clamp(1.1rem,3svh,1.8rem);
  font-family:var(--micro);font-weight:300;
  font-size:clamp(.58rem,1.4vw,.68rem);
  letter-spacing:.2em;text-transform:uppercase;
}
.jump a.to{
  position:relative;
  padding:.4rem clamp(.7rem,2vw,1.15rem);
  color:rgba(246,227,189,.72);
  border-bottom:1px solid rgba(246,227,189,.34);
  transition:color .45s var(--ease),border-color .45s var(--ease);
}
.jump a.to + a.to{border-left:1px solid rgba(246,227,189,.20)}
.jump a.to:hover{color:var(--cream);border-bottom-color:var(--cream)}
/* the section you are in is named, not hidden — it just stops leading
   anywhere else */
.jump a.to[aria-current="true"]{color:var(--gold);border-bottom-color:var(--gold)}

/* The one thing on the page that is not navigation: it leaves the site.
   So it is the one thing shaped like a button rather than a link —
   enclosed, gold-edged, with the arrow that means "away from here" —
   and it sits apart from the three section links with real space
   between, so the rail reads as "here are the parts, and here is how
   you come". */
.jump .ticket{
  display:inline-flex;align-items:center;gap:.5em;
  margin-left:clamp(.8rem,3vw,2rem);
  padding:.62em 1.5em;
  border:1px solid rgba(217,164,65,.55);
  border-radius:999px;
  color:var(--gold);
  letter-spacing:.2em;
  transition:color .45s var(--ease),border-color .45s var(--ease),background-color .45s var(--ease);
}
.jump .ticket:hover,.jump .ticket:focus-visible{
  color:#0b0b0d;background:var(--gold);border-color:var(--gold);
}
.jump .ticket .out{font-size:.9em;line-height:1}
/* named for a screen reader, silent for everyone else */
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

/* ────────────────────────  side navigation  ───────────────────────── */
.dots{
  position:fixed;z-index:8;right:clamp(.7rem,2vw,1.7rem);top:50%;
  transform:translateY(-50%);
  display:flex;flex-direction:column;gap:1rem;
}
.dots button{appearance:none;background:none;border:0;padding:.4rem;cursor:pointer;display:block}
.dots i{
  display:block;width:6px;height:6px;border-radius:50%;
  background:rgba(246,227,189,.26);
  transition:background .5s var(--ease),transform .5s var(--ease);
}
.dots button:hover i{background:rgba(246,227,189,.6)}
.dots button[aria-current="true"] i{background:var(--gold);transform:scale(1.5)}

/* ──────────────────────────  sound toggle  ────────────────────────── */
.sound{
  position:fixed;z-index:8;left:clamp(.8rem,2vw,1.7rem);
  bottom:calc(var(--rail) + .2rem);
  appearance:none;background:none;border:0;cursor:pointer;
  display:flex;align-items:center;gap:.55rem;
  color:rgba(246,227,189,.5);
  font-family:var(--micro);font-size:.56rem;font-weight:300;
  letter-spacing:.24em;text-transform:uppercase;
  transition:color .5s var(--ease);
}
/* display:flex on the button outranks the UA's [hidden]{display:none},
   so without this the toggle stays on screen with nothing to play */
.sound[hidden]{display:none}
.sound:hover{color:var(--cream)}
.sound .bars{display:flex;align-items:flex-end;gap:2px;height:9px}
.sound .bars b{width:2px;height:3px;background:currentColor;transition:height .3s var(--ease)}
.sound[aria-pressed="true"] .bars b:nth-child(1){height:5px}
.sound[aria-pressed="true"] .bars b:nth-child(2){height:9px}
.sound[aria-pressed="true"] .bars b:nth-child(3){height:4px}

/* ───────────────────────────  the opening  ──────────────────────────
   The title arrives letter by letter and the lines under it rise, once
   a visit. On any later load in the same tab .settled is set before the
   first paint, so the page is simply already there. */
.js [data-reveal]{opacity:0;transform:translateY(12px)}
.js [data-reveal].in{
  opacity:1;transform:none;
  transition:opacity 1.1s var(--ease) var(--d,0s),transform 1.1s var(--ease) var(--d,0s);
}
.js .title .ch{opacity:0;transform:translateY(.35em)}
.js .title.in .ch{
  opacity:1;transform:none;
  transition:opacity 1s var(--ease) var(--d,0s),transform 1s var(--ease) var(--d,0s);
}
.js.settled [data-reveal],
.js.settled .title .ch{opacity:1!important;transform:none!important;transition:none!important}

/* ══════════════════════════  narrow screens  ═══════════════════════════
   A phone is narrower than these photographs are tall, so the same
   whole-photograph rule letterboxes them by width instead of standing
   them by height. Everything else goes to one column and every size is
   in svh, so a section is still exactly one screen and still fits. */
@media (max-width:820px),(orientation:portrait){
  :root{--gutter:1.4rem;--rail:3.1rem}

  /* the landing's words move off the photograph's centre and sit under
     it, over the black, where nothing has to be read through a picture */
  #amor{padding-bottom:calc(var(--rail) + 1rem)}
  .title{font-size:clamp(1.9rem,10.5vw,3.2rem);letter-spacing:.12em;text-indent:.12em}
  .subtitle{font-size:.7rem;letter-spacing:.22em;text-indent:.22em}
  .when{font-size:.68rem}

  /* the verse above, the figure below — both whole, both within the
     one screen the section is allowed */
  #about{
    grid-template-columns:1fr;
    grid-template-rows:auto minmax(0,1fr);
    align-items:center;justify-items:center;
    gap:clamp(.8rem,2.5svh,1.6rem);
    padding:clamp(1.5rem,4svh,2.5rem) var(--inset) calc(var(--rail) + .6rem);
  }
  #about .verse img{max-height:40svh}
  #about .beside{position:static;justify-content:center;width:100%;min-height:0}
  #about .beside img{max-height:100%;max-width:100%}
  /* This fade used to run from the TOP, which is where her head is —
     nothing was ever cropped (the photograph measures at its exact
     natural ratio, 0px clipped) but the top 18% was faded to black and
     read as a cut-off head. It runs from the foot now, so what
     dissolves is the floor under her feet. */
  #about .beside::before{
    background:linear-gradient(to top,#000 0%,rgba(0,0,0,.35) 7%,rgba(0,0,0,0) 16%);
  }
  /* and if a screen is ever short enough that something must go, it is
     taken off the bottom: the top of the frame is pinned */
  #about .beside{align-items:flex-start}

  .section-title{font-size:clamp(1.3rem,7vw,1.9rem);letter-spacing:.14em;text-indent:.14em;margin-bottom:clamp(1rem,3svh,1.8rem)}
  .roster li{font-size:.66rem;letter-spacing:.18em;text-indent:.18em;padding:clamp(.32rem,1.15svh,.6rem) 0}


  /* the links wrap out to the screen edges here, so the toggle cannot
     keep the bottom-left corner */
  .sound{bottom:auto;top:calc(env(safe-area-inset-top) + .8rem);left:.9rem}
  .dots{gap:.8rem;right:.55rem}
  .dots i{width:5px;height:5px}
  .jump{padding-bottom:clamp(.9rem,2.4svh,1.4rem)}
  .jump a{padding:.35rem clamp(.5rem,3vw,.9rem);font-size:.58rem;letter-spacing:.16em}
}

/* a phone held sideways has almost no height: let the sections grow and
   be scrolled rather than squeezing the photographs into nothing */
@media (orientation:landscape) and (max-height:460px){
  html{scroll-snap-type:none}
  .panel{height:auto;min-height:100svh;padding-block:2.5rem}
  #about{padding-right:46%}
  #about .verse img{max-height:52svh}
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .js [data-reveal],.js .title .ch{opacity:1!important;transform:none!important;transition:none!important}
  *{transition-duration:.01ms!important}
}
</style>
</head>

<body>

<nav class="dots" aria-label="Sections">
  <button type="button" data-to="amor" aria-label="Amor fati"><i></i></button>
  <button type="button" data-to="about" aria-label="About"><i></i></button>
  <button type="button" data-to="artists" aria-label="Artists"><i></i></button>
</nav>

<button class="sound" id="sound" type="button" aria-pressed="false" aria-label="Play ambient sound" hidden>
  <span class="bars" aria-hidden="true"><b></b><b></b><b></b></span>
  <span>sound</span>
</button>
<audio id="ambient" src="audio/ambient.mp3" loop preload="metadata"></audio>

<!-- The one copy of the section links. The script stamps it into every
     section, so the four rows are identical by construction. -->
<template id="jump-tpl">
  <nav class="jump" aria-label="Sections">
    <a class="to" href="#amor">Amor</a>
    <a class="to" href="#about">About</a>
    <a class="to" href="#artists">Artists</a>
    <!-- EDIT — the ticket page's URL goes in href -->
    <a class="ticket" href="https://www.kickstarter.com/" target="_blank" rel="noopener noreferrer">
      Tickets<span class="out" aria-hidden="true">↗</span>
      <span class="sr">(opens in a new tab)</span>
    </a>
  </nav>
</template>

<main>

  <!-- ══════════════════  I. amor  ══════════════════ -->
  <section class="panel" id="amor">
    <div class="shot">
      <img src="images/hero.jpg" width="720" height="1080"
           alt="A dancer arched backwards, arms reaching upward, lit warm against a black room.">
    </div>
    <div class="veil veil-foot"></div>

    <div class="says">
      <h1 class="title" data-split>Amor Fati</h1>
      <p class="subtitle" data-reveal style="--d:.9s">Vallerie live with company</p>
      <p class="when" data-reveal style="--d:1.1s">September 16–17 &nbsp;·&nbsp; 7–9 pm</p>
    </div>
  </section>

  <!-- ══════════════════  II. about  ══════════════════ -->
  <!-- The verse in the company's own hand. The words live in the alt
       text, so screen readers and link previews still get them. -->
  <section class="panel" id="about">
    <div class="says verse" data-reveal>
      <img src="images/text-cropped.png" width="1001" height="854"
           alt="Each moment of all time gifted us movement, music, togetherness. Come bask with us in this aliveness! We honour your attention. — Vallerie with Company">
    </div>
    <div class="beside" data-reveal style="--d:.2s">
      <img src="images/dancer.jpg" width="719" height="1079" alt="">
    </div>
  </section>

  <!-- ══════════════════  III. artists  ══════════════════ -->
  <section class="panel" id="artists">
    <div class="shot">
      <img src="images/artists.jpeg" width="720" height="1080"
           alt="A dancer turning by candlelight, a pale cloth trailing through the air.">
    </div>
    <div class="veil veil-left"></div>

    <div class="says">
      <h2 class="section-title" data-reveal>Artists</h2>
      <ul class="roster">
        <li class="lead" data-reveal style="--d:.10s">Vallerie O</li>
        <li data-reveal style="--d:.18s">Yazz Meavis</li>
        <li data-reveal style="--d:.24s">Amina Avdić</li>
        <li data-reveal style="--d:.30s">Carl Backman</li>
        <li data-reveal style="--d:.36s">Eliot Charoff</li>
        <li data-reveal style="--d:.42s">Lova Hellberg</li>
        <li data-reveal style="--d:.48s">Joakim Benckert</li>
        <li data-reveal style="--d:.54s">Zean Farence Diaz</li>
        <li data-reveal style="--d:.60s">Kristoffer Benckert</li>
        <li data-reveal style="--d:.66s">Elias Ljungberg Photography</li>
      </ul>

      <p class="reach" data-reveal style="--d:.72s">
        <a href="https://instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a><!-- EDIT -->
        <a href="mailto:hello@example.com">Email</a><!-- EDIT -->
      </p>
    </div>
  </section>

</main>

<script>
(function(){
  "use strict";
  var root = document.documentElement;
  root.classList.add("js");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");

  /* ── has this visit already seen the opening? ──
     sessionStorage, so it plays once a visit and again tomorrow. Read
     before the first paint: if the opening is spent the page is simply
     already in place rather than assembling itself a second time. */
  var SEEN = "amorfati.opening";
  var spent = false;
  try { spent = window.sessionStorage.getItem(SEEN) === "1"; } catch (e) {}
  if (spent || reduce.matches) root.classList.add("settled");
  function markSeen(){ try { window.sessionStorage.setItem(SEEN, "1"); } catch (e) {} }

  /* ── the same section links in every section ── */
  var tpl = document.getElementById("jump-tpl");
  var panels = Array.prototype.slice.call(document.querySelectorAll(".panel"));
  if (tpl && "content" in tpl) {
    panels.forEach(function(p){ p.appendChild(tpl.content.cloneNode(true)); });
  }
  var jumps = Array.prototype.slice.call(document.querySelectorAll(".jump"));

  /* ── the title arrives letter by letter, words kept unbroken ── */
  var title = document.querySelector("[data-split]");
  if (title) {
    var text = title.textContent.trim(), n = 0;
    title.textContent = "";
    text.split(/\s+/).forEach(function(word, wi){
      if (wi) {
        var gap = document.createElement("span");
        gap.className = "ch"; gap.textContent = " ";
        title.appendChild(gap);
      }
      var holder = document.createElement("span");
      holder.className = "word";
      word.split("").forEach(function(ch){
        var s = document.createElement("span");
        s.className = "ch";
        s.textContent = ch;
        s.style.setProperty("--d", (0.2 + (n++) * 0.055) + "s");
        holder.appendChild(s);
      });
      title.appendChild(holder);
    });
    title.setAttribute("aria-label", text);
  }

  if (title && !spent && !reduce.matches) {
    /* The stylesheet carrying the display face is deferred so it does
       not hold up the first paint — so on a cold visit it can land in
       the middle of the rise and every glyph changes shape in flight.
       The rise waits for it, but never longer than a beat: if it is not
       coming, the title arrives in the fallback rather than not at all.
       It is a width measurement rather than document.fonts, which stays
       empty here because Chrome does not expose faces from a
       cross-origin stylesheet, and fonts.check() answers "can this be
       rendered" — true from the first frame, since the fallback can. */
    var began = false;
    function begin(){
      if (began) return;
      began = true;
      markSeen();
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){ title.classList.add("in"); });
      });
    }
    var probe = document.createElement("span");
    probe.textContent = title.getAttribute("aria-label") || "Amor Fati";
    probe.setAttribute("aria-hidden", "true");
    probe.style.cssText = "position:absolute;left:-9999px;top:0;visibility:hidden;" +
      "white-space:pre;font-size:100px;font-weight:500;text-transform:uppercase";
    document.body.appendChild(probe);
    var fallback = 'Didot,"Times New Roman",serif';
    function ready(){
      probe.style.fontFamily = fallback;
      var without = probe.getBoundingClientRect().width;
      probe.style.fontFamily = '"Bodoni Moda",' + fallback;
      return Math.abs(probe.getBoundingClientRect().width - without) > 0.5;
    }
    function go(){
      if (probe.parentNode) probe.parentNode.removeChild(probe);
      begin();
    }
    var giveUp = setTimeout(go, 1200);
    (function wait(){
      if (began) return;
      if (ready()) { clearTimeout(giveUp); go(); }
      else setTimeout(wait, 50);
    })();
  } else {
    markSeen();
  }

  /* ── lines rise as they arrive ── */
  var revealables = document.querySelectorAll("[data-reveal]");
  function rise(el){
    if (reduce.matches || spent) { el.classList.add("in"); return; }
    /* the layer is asked for on one frame and the transition started on
       the next, so the first frame of the rise is already the
       compositor's; it is handed back once the line has landed */
    el.style.willChange = "opacity, transform";
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.classList.add("in");
        var d = parseFloat(getComputedStyle(el).transitionDelay) || 0;
        setTimeout(function(){ el.style.willChange = ""; }, d * 1000 + 1500);
      });
    });
  }
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (e.isIntersecting) { rise(e.target); io.unobserve(e.target); }
      });
    }, { threshold: 0.1, rootMargin: "0px 0px -5% 0px" });
    Array.prototype.forEach.call(revealables, function(el){ io.observe(el); });
  } else {
    Array.prototype.forEach.call(revealables, function(el){ el.classList.add("in"); });
  }

  /* ── which section are we in ── */
  var dots = Array.prototype.slice.call(document.querySelectorAll(".dots button"));
  var ids = dots.map(function(b){ return b.dataset.to; });
  var lit = -1;
  function light(i){
    if (i === lit || i < 0) return;
    lit = i;
    dots.forEach(function(b, d){ b.setAttribute("aria-current", d === i ? "true" : "false"); });
    /* the same state in every copy of the link row */
    jumps.forEach(function(row){
      var links = row.querySelectorAll("a.to");
      for (var k = 0; k < links.length; k++) {
        links[k].setAttribute("aria-current", k === i ? "true" : "false");
      }
    });
  }
  /* Which section fills the screen is a question of scroll position —
     the one whose middle is nearest the middle of the viewport — not of
     intersection, which lights the wrong one mid-transition. */
  var ticking = false;
  function which(){
    ticking = false;
    var y = window.scrollY || window.pageYOffset || 0;
    var mid = y + window.innerHeight / 2;
    var best = 0, gap = Infinity;
    for (var i = 0; i < panels.length; i++) {
      var box = panels[i].getBoundingClientRect();
      var centre = box.top + y + box.height / 2;
      var d = Math.abs(centre - mid);
      if (d < gap) { gap = d; best = i; }
    }
    light(best);
  }
  function onScroll(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(which);
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll, { passive: true });
  which();

  /* ── going to a section ── */
  var arrive;
  function goTo(i){
    var panel = panels[i];
    if (!panel) return;
    var target = panel.getBoundingClientRect().top + (window.scrollY || window.pageYOffset || 0);
    try {
      window.scrollTo({ top: target, behavior: reduce.matches ? "auto" : "smooth" });
    } catch (e) {
      window.scrollTo(0, target);          // older browsers take two numbers
    }
    /* a smooth scroll can be cancelled mid-flight — snapping and touch
       both do it — and the click then looks like it did nothing */
    clearTimeout(arrive);
    arrive = setTimeout(function(){
      var here = window.scrollY || window.pageYOffset || 0;
      if (Math.abs(here - target) > 4) window.scrollTo(0, target);
    }, 900);
  }
  dots.forEach(function(b, i){ b.addEventListener("click", function(){ goTo(i); }); });
  jumps.forEach(function(row){
    Array.prototype.forEach.call(row.querySelectorAll("a.to"), function(a){
      a.addEventListener("click", function(e){
        var i = ids.indexOf((a.getAttribute("href") || "").slice(1));
        if (i < 0) return;
        e.preventDefault();
        goTo(i);
      });
    });
  });

  /* ── ambient sound: off until asked, hidden if the file isn't there ── */
  var audio = document.getElementById("ambient");
  var btn = document.getElementById("sound");
  var fade;
  audio.addEventListener("canplay", function(){ btn.hidden = false; }, { once: true });
  audio.addEventListener("error", function(){ btn.hidden = true; });

  function fadeTo(target, done){
    clearInterval(fade);
    var step = (target - audio.volume) / 40;          // ~2s at 50ms
    fade = setInterval(function(){
      var v = audio.volume + step;
      if ((step > 0 && v >= target) || (step < 0 && v <= target)) {
        clearInterval(fade);
        audio.volume = Math.min(1, Math.max(0, target));
        if (done) done();
      } else {
        audio.volume = Math.min(1, Math.max(0, v));
      }
    }, 50);
  }
  btn.addEventListener("click", function(){
    if (btn.getAttribute("aria-pressed") === "true") {
      fadeTo(0, function(){ audio.pause(); });
      btn.setAttribute("aria-pressed", "false");
      btn.setAttribute("aria-label", "Play ambient sound");
    } else {
      audio.volume = 0;
      var p = audio.play();
      if (p && p.catch) p.catch(function(){ btn.hidden = true; });
      fadeTo(0.45);
      btn.setAttribute("aria-pressed", "true");
      btn.setAttribute("aria-label", "Mute ambient sound");
    }
  });
})();
</script>

</body>
</html>
